name: CI

on:
  push:
    # phase* too: the build is developed on stacked phase branches, and a
    # branch push used to run nothing, so CI never saw Phases 4 to 9.
    branches: [main, "phase*"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch rather than queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint, types, tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject; 3.12 is what the team runs.
        # Testing both stops us from accidentally depending on newer syntax.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Types (mypy strict)
        run: mypy

      - name: Tests
        run: pytest --cov=apix --cov-report=term-missing

      # Figures written in the documentation are claims about the system, and
      # they have drifted from it three times. Tests check code against code;
      # this checks the documents against the code.
      - name: Documented figures match the code
        run: python docs/verify_claims.py

  evaluation:
    name: reproduce published results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e .

      # The figures in the paper and the design document must stay reproducible.
      # If a change moves zombie recall off 100%, or lets a live endpoint be
      # marked for removal, CI fails rather than the team finding out in a viva.
      - name: Run comparative benchmark
        run: apix benchmark

      - name: Assert published figures still hold
        run: |
          python - <<'PY'
          import json, sys

          r = json.load(open("data/benchmark.json"))
          full, conv = r["api-exorcist"], r["conventional"]

          failures = []
          if full["zombie_recall_pct"] != 100.0:
              failures.append(f"zombie recall regressed to {full['zombie_recall_pct']}%")
          if full["coverage_pct"] != 100.0:
              failures.append(f"estate coverage regressed to {full['coverage_pct']}%")
          if full["zombies_caught"] <= conv["zombies_caught"]:
              failures.append("correlation no longer beats a conventional inventory")
          acc = full["classification"]["accuracy"]
          if acc < 0.95:
              failures.append(f"classification accuracy dropped to {acc}")

          # A false ZOMBIE on a live endpoint is an outage, and the one failure
          # mode with no acceptable rate above zero.
          for e in full["classification"]["errors"]:
              if e["predicted"] == "ZOMBIE":
                  failures.append(f"live endpoint marked for removal: {e['endpoint_id']}")

          if failures:
              print("PUBLISHED RESULTS REGRESSED:")
              for f in failures:
                  print(f"  - {f}")
              sys.exit(1)
          print("All published figures reproduced.")
          PY

      # The removal gate is the mechanism that stops this product causing an
      # outage. It must be checked end to end, not only in unit tests.
      - name: Assert the removal gate holds
        run: |
          python - <<'PY'
          import json, subprocess, sys

          out = subprocess.run(
              ["apix", "impact", "--json"], capture_output=True, text=True, check=True
          ).stdout
          data = json.loads(out)

          failures = []
          if data["graph"]["call_edges"] == 0:
              failures.append("dependency graph has no edges - it is not being built")

          for a in data["assessments"]:
              if a["may_proceed"] and not a["blast_radius"]["isolated"]:
                  failures.append(
                      f"cleared for removal despite dependents: {a['endpoint_id']}"
                  )
              if a["may_proceed"] and a["label"] != "ZOMBIE":
                  failures.append(
                      f"non-zombie cleared for removal: {a['endpoint_id']}"
                  )

          if failures:
              print("REMOVAL GATE FAILED:")
              for f in failures:
                  print(f"  - {f}")
              sys.exit(1)
          cleared = sum(1 for a in data["assessments"] if a["may_proceed"])
          print(f"Removal gate holds. {cleared} endpoint(s) cleared, all isolated.")
          PY

      - name: Upload figures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: benchmark-results
          path: data/benchmark.json

  dashboard:
    name: dashboard (types, tests, committed build is current)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install (exact versions from the lockfile)
        run: npm ci

      - name: Types (TypeScript strict)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      # The build is committed so that `pip install` ships a working dashboard
      # with no Node on the machine. A committed artefact can silently fall
      # behind its source, so rebuild it here and fail if anything differs,
      # including a renamed or added file that `git diff` alone would miss.
      - name: Rebuild
        run: npm run build

      - name: Committed build matches the source
        working-directory: .
        run: |
          stale="$(git status --porcelain -- src/apix/api/dashboard)"
          if [ -n "$stale" ]; then
            echo "$stale"
            echo "::error::src/apix/api/dashboard is stale. Run 'npm run build' in dashboard/ and commit the result."
            exit 1
          fi
          echo "Committed dashboard build matches the source."

      - name: No known-vulnerable runtime dependencies
        run: npm audit --omit=dev --audit-level=high

  container:
    name: container image (build, run as deployed, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Build
        run: docker build -t api-exorcist:ci .

      - name: Refuses to start without configured tokens
        run: |
          if docker run --rm api-exorcist:ci; then
            echo "::error::the image started with no APIX_API_TOKENS"
            exit 1
          fi

      # Note: `! cmd` does not trip `set -e` in bash, so every negative check
      # below is written as an explicit if/exit.
      - name: Smoke test (read-only filesystem, no capabilities)
        run: |
          out="$(docker run --rm api-exorcist:ci token ci --role viewer)"
          token="$(grep -o 'apx_[A-Za-z0-9_-]*' <<<"$out" | head -1)"
          entry="$(grep -o 'ci:viewer:[0-9a-f]*' <<<"$out" | head -1)"
          echo "::add-mask::$token"
          docker run -d --name apix -p 127.0.0.1:8600:8600 \
            -e APIX_API_TOKENS="$entry" --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges api-exorcist:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' apix)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' apix | grep -qx healthy
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8600/v1/summary)" = 401
          curl -sf -H "Authorization: Bearer $token" localhost:8600/metrics \
            | grep -qx 'apix_audit_chain_ok 1'
          docker logs apix | grep -q '"event": "request"'
          if docker logs apix 2>&1 | grep -qF "$token"; then
            echo "::error::the token appeared in the container's logs"; exit 1
          fi
          if docker exec apix python -c "import pip" 2>/dev/null; then
            echo "::error::pip is present in the runtime image"; exit 1
          fi
          echo "Image healthy, authenticated, read-only, token kept out of logs."

      - name: Container logs on failure
        if: failure()
        run: docker logs apix || true
