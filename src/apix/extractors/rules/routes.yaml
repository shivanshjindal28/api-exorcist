# Semgrep rules for extracting HTTP route declarations from source.
#
# Why Semgrep and not a regular expression
# ----------------------------------------
# These patterns match the *abstract syntax tree*, not the text. A route
# declaration inside a comment, a docstring, or a string literal does not match,
# because structurally it is not a decorator applied to a function. A regex over
# source cannot make that distinction, and in a real repository the difference is
# hundreds of false endpoints — which for this project would be hundreds of
# fabricated "shadow APIs".
#
# Metavariable transport
# ----------------------
# The Semgrep OSS JSON output does not expose a `metavars` field, but it *does*
# interpolate metavariables into the rule `message`. The messages below are
# therefore a deliberate wire format: `APIX|path=$PATH|func=$FUNC`, parsed back
# in semgrep_extractor.py. The HTTP method comes from the rule id, so each method
# gets its own rule rather than being captured as a metavariable.

rules:
  # ------------------------------------------------------- Mount prefixes
  # Routes are declared relative to the router they hang off, and that router
  # is mounted under a prefix somewhere else entirely. Without these, a scan
  # reports `/me` as an endpoint when the real path is `/api/v1/users/me` —
  # wrong, and wrong in the direction that invents endpoints nobody serves.
  - id: apix-py-router-prefix
    languages: [python]
    severity: INFO
    message: "APIXPREFIX|var=$VAR|prefix=$PREFIX"
    pattern: $VAR = APIRouter(..., prefix=$PREFIX, ...)

  - id: apix-py-include-router
    languages: [python]
    severity: INFO
    message: "APIXMOUNT|prefix=$PREFIX"
    pattern-either:
      - pattern: $APP.include_router(..., prefix=$PREFIX, ...)
      - pattern: $APP.include_router($ROUTER, prefix=$PREFIX)

  # ---------------------------------------------------------------- FastAPI
  - id: apix-py-fastapi-get
    languages: [python]
    severity: INFO
    message: "APIX|path=$PATH|func=$FUNC"
    patterns:
      - pattern-either:
          - pattern: |
              @$APP.get($PATH, ...)
              def $FUNC(...): ...
          - pattern: |
              @$APP.get($PATH, ...)
              async def $FUNC(...): ...

  - id: apix-py-fastapi-post
    languages: [python]
    severity: INFO
    message: "APIX|path=$PATH|func=$FUNC"
    patterns:
      - pattern-either:
          - pattern: |
              @$APP.post($PATH, ...)
              def $FUNC(...): ...
          - pattern: |
              @$APP.post($PATH, ...)
              async def $FUNC(...): ...

  - id: apix-py-fastapi-put
    languages: [python]
    severity: INFO
    message: "APIX|path=$PATH|func=$FUNC"
    patterns:
      - pattern-either:
          - pattern: |
              @$APP.put($PATH, ...)
              def $FUNC(...): ...
          - pattern: |
              @$APP.put($PATH, ...)
              async def $FUNC(...): ...

  - id: apix-py-fastapi-patch
    languages: [python]
    severity: INFO
    message: "APIX|path=$PATH|func=$FUNC"
    patterns:
      - pattern-either:
          - pattern: |
              @$APP.patch($PATH, ...)
              def $FUNC(...): ...
          - pattern: |
              @$APP.patch($PATH, ...)
              async def $FUNC(...): ...

  - id: apix-py-fastapi-delete
    languages: [python]
    severity: INFO
    message: "APIX|path=$PATH|func=$FUNC"
    patterns:
      - pattern-either:
          - pattern: |
              @$APP.delete($PATH, ...)
              def $FUNC(...): ...
          - pattern: |
              @$APP.delete($PATH, ...)
              async def $FUNC(...): ...

  # ------------------------------------------------------------------ Flask
  # Flask's method defaults to GET and is otherwise passed as an argument, so
  # the extractor reads it from the matched line rather than the rule id.
  - id: apix-py-flask-route
    languages: [python]
    severity: INFO
    message: "APIX|path=$PATH|func=$FUNC"
    patterns:
      - pattern-either:
          - pattern: |
              @$APP.route($PATH, ...)
              def $FUNC(...): ...
          - pattern: |
              @$APP.route($PATH, ...)
              async def $FUNC(...): ...

  # ---------------------------------------------------------------- Express
  # Two spellings: `router.get('/x', h)` and the chained
  # `router.route('/x').get(h).post(h2)`, where every method after the first
  # hangs off the previous call. Projects written in the chained form (idurar
  # declares all of its routes that way) were invisible before it was matched.
  # In the chained form `$APP.get($PATH, ...)` also matches with the handler as
  # $PATH; looks_like_route rejects those.
  - id: apix-js-express-get
    languages: [javascript, typescript]
    severity: INFO
    message: "APIX|path=$PATH|func=anonymous"
    pattern-either:
      - pattern: $APP.get($PATH, ...)
      - pattern: $R.route($PATH).get(...)
      - pattern: $R.route($PATH).$M1(...).get(...)
      - pattern: $R.route($PATH).$M1(...).$M2(...).get(...)
      - pattern: $R.route($PATH).$M1(...).$M2(...).$M3(...).get(...)

  - id: apix-js-express-post
    languages: [javascript, typescript]
    severity: INFO
    message: "APIX|path=$PATH|func=anonymous"
    pattern-either:
      - pattern: $APP.post($PATH, ...)
      - pattern: $R.route($PATH).post(...)
      - pattern: $R.route($PATH).$M1(...).post(...)
      - pattern: $R.route($PATH).$M1(...).$M2(...).post(...)
      - pattern: $R.route($PATH).$M1(...).$M2(...).$M3(...).post(...)

  - id: apix-js-express-put
    languages: [javascript, typescript]
    severity: INFO
    message: "APIX|path=$PATH|func=anonymous"
    pattern-either:
      - pattern: $APP.put($PATH, ...)
      - pattern: $R.route($PATH).put(...)
      - pattern: $R.route($PATH).$M1(...).put(...)
      - pattern: $R.route($PATH).$M1(...).$M2(...).put(...)
      - pattern: $R.route($PATH).$M1(...).$M2(...).$M3(...).put(...)

  - id: apix-js-express-patch
    languages: [javascript, typescript]
    severity: INFO
    message: "APIX|path=$PATH|func=anonymous"
    pattern-either:
      - pattern: $APP.patch($PATH, ...)
      - pattern: $R.route($PATH).patch(...)
      - pattern: $R.route($PATH).$M1(...).patch(...)
      - pattern: $R.route($PATH).$M1(...).$M2(...).patch(...)
      - pattern: $R.route($PATH).$M1(...).$M2(...).$M3(...).patch(...)

  - id: apix-js-express-delete
    languages: [javascript, typescript]
    severity: INFO
    message: "APIX|path=$PATH|func=anonymous"
    pattern-either:
      - pattern: $APP.delete($PATH, ...)
      - pattern: $R.route($PATH).delete(...)
      - pattern: $R.route($PATH).$M1(...).delete(...)
      - pattern: $R.route($PATH).$M1(...).$M2(...).delete(...)
      - pattern: $R.route($PATH).$M1(...).$M2(...).$M3(...).delete(...)

  # A router is mounted under a prefix in another file:
  #   const api = require('./routes/api');  app.use('/api', auth, api);
  # The router name is resolved to its file in semgrep_extractor.py by reading
  # the require/import in the mounting file. Middleware between the two is
  # skipped by the `...`.
  #
  # `on` is what `.use` was called on. A router built in the same file and
  # mounted there (`const api = Router().use(tags); Router().use('/api', api)`,
  # the shape of Express's own reference app) is followed through it.
  - id: apix-js-express-mount
    languages: [javascript, typescript]
    severity: INFO
    message: "APIXJSMOUNT|prefix=$PREFIX|router=$ROUTER|on=$APP"
    pattern: $APP.use($PREFIX, ..., $ROUTER)

  # A router mounted with no prefix: `app.use(routes)`, `api.use(tagsRouter)`.
  - id: apix-js-express-mount-bare
    languages: [javascript, typescript]
    severity: INFO
    message: "APIXJSMOUNT|prefix=|router=$ROUTER|on=$APP"
    pattern: $APP.use($ROUTER)

  # ------------------------------------------------------------- Spring MVC
  # Each rule finds a mapped method in any form: bare (@PostMapping), with a
  # positional path, or with value= / path=. The path itself, and the
  # class-level @RequestMapping prefix it sits under, are read from the source
  # by apix/extractors/spring.py: a structural pattern cannot see the class
  # annotation, and matching only @XMapping($PATH) missed every bare mapping.
  - id: apix-java-spring-get
    languages: [java]
    severity: INFO
    message: "APIX|path=|func=$FUNC"
    pattern-either:
      - pattern: |
          @GetMapping
          $RET $FUNC(...) { ... }
      - pattern: |
          @GetMapping(...)
          $RET $FUNC(...) { ... }

  - id: apix-java-spring-post
    languages: [java]
    severity: INFO
    message: "APIX|path=|func=$FUNC"
    pattern-either:
      - pattern: |
          @PostMapping
          $RET $FUNC(...) { ... }
      - pattern: |
          @PostMapping(...)
          $RET $FUNC(...) { ... }

  - id: apix-java-spring-put
    languages: [java]
    severity: INFO
    message: "APIX|path=|func=$FUNC"
    pattern-either:
      - pattern: |
          @PutMapping
          $RET $FUNC(...) { ... }
      - pattern: |
          @PutMapping(...)
          $RET $FUNC(...) { ... }

  - id: apix-java-spring-delete
    languages: [java]
    severity: INFO
    message: "APIX|path=|func=$FUNC"
    pattern-either:
      - pattern: |
          @DeleteMapping
          $RET $FUNC(...) { ... }
      - pattern: |
          @DeleteMapping(...)
          $RET $FUNC(...) { ... }

  - id: apix-java-spring-patch
    languages: [java]
    severity: INFO
    message: "APIX|path=|func=$FUNC"
    pattern-either:
      - pattern: |
          @PatchMapping
          $RET $FUNC(...) { ... }
      - pattern: |
          @PatchMapping(...)
          $RET $FUNC(...) { ... }

  - id: apix-java-spring-request
    languages: [java]
    severity: INFO
    message: "APIX|path=|func=$FUNC"
    pattern-either:
      - pattern: |
          @RequestMapping
          $RET $FUNC(...) { ... }
      - pattern: |
          @RequestMapping(...)
          $RET $FUNC(...) { ... }
